<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar | Cocas’ Michel</title>
<meta name="description" content="Ingresa a tu cuenta de Cocas’ Michel.">
<meta name="theme-color" content="#1a1716">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<a class="saltar" href="#contenido">Saltar al contenido</a>
<header id="encabezado"></header>

<main id="contenido" class="pagina">
  <div class="contenedor angosto">
    <h1 class="titulo-pagina">Ingresar</h1>
    <p class="intro">Entra a tu cuenta para ver tus citas.</p>

    <form class="formulario" id="formulario-login" novalidate>
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <small class="error" role="alert"></small>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <small class="error" role="alert"></small>
      </div>

      <p class="error-general" id="error-general" role="alert"></p>
      <button class="btn" type="submit" id="enviar">Ingresar</button>
    </form>

    <p class="alterno">¿No tienes cuenta? <a href="registro.html">Crea una</a></p>
  </div>
</main>

<footer id="pie"></footer>
<script type="module" src="js/login.js"></script>
</body>
</html>
